[package]
name = "notchbase-dock"
version = "0.1.0"
edition.workspace = true
description = "A Dock for macOS in the notchbase style: black liquid, springs and the apps you already pinned"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "notchbase-dock"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
egui.workspace = true
egui_glow = "0.36"
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
libc = "0.2"
notchbase-paint.workspace = true
notchbase-usage.workspace = true
objc2 = "0.6"
png = "0.18"
raw-window-handle.workspace = true
winit = "0.30"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSProcessInfo",
    "NSProgress",
    "NSDistributedNotificationCenter",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "libc",
    "NSApplication",
    "NSColor",
    "NSColorSpace",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGColor",
    "CGContext",
    "CGImage",
    "CGPath",
] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "QLThumbnailGenerationRequest",
    "QLThumbnailGenerator",
    "QLThumbnailRepresentation",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "dispatch2",
    "libc",
    "SCShareableContent",
    "SCStream",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CATransaction",
] }
