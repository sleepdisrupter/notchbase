[package]
name = "notchbase-sdk"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Build tools for notchbase: an Elm-style API for the notch"
license = "MIT"
repository = "https://github.com/sleepdisrupter/notchbase"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints.clippy]
missing_safety_doc = "allow"
