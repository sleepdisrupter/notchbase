[package]
name = "dictation"
version = "0.1.0"
edition.workspace = true
description = "Hold fn (Ctrl+Win on Windows) and talk: Groq's Whisper types what you said, and learns your words"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
flacenc = { version = "0.5", default-features = false }
notchbase-net.workspace = true
notchbase-sdk.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq = { workspace = true, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSSound",
    "NSWorkspace",
] }

[target.'cfg(target_os = "windows")'.dependencies]
notchbase-wasapi.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
