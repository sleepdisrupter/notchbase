[package]
name = "roam"
version = "0.1.0"
edition.workspace = true
description = "Use one keyboard and mouse across your Mac and Windows computers on the same network"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
chacha20poly1305 = "0.10"
gethostname = "1"
if-addrs = "0.13"
getrandom = "0.3"
notchbase-sdk.workspace = true
png = "0.18"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSColor",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSScreen",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-quartz-core",
    "AVAnimation",
    "AVQueuedSampleBufferRendering",
    "AVSampleBufferDisplayLayer",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-video",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "SCShareableContent",
    "SCStream",
] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-media",
    "objc2-core-video",
    "VTBase",
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTSession",
    "VTErrors",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
