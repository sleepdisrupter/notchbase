[package]
name = "notchbase-setup"
version = "0.1.0"
edition.workspace = true
description = "The notchbase installer: downloads the newest notchbase and installs it"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
build = "build.rs"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui.workspace = true
image = { workspace = true, features = ["png"] }
notchbase-net.workspace = true
notchbase-paint.workspace = true
notchbase-release.workspace = true
notchbase-spectrum.workspace = true
raw-window-handle.workspace = true

[build-dependencies]
notchbase-build.workspace = true

[target.'cfg(windows)'.dependencies]
notchbase-wasapi.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
