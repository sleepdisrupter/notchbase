name: Bug report
description: Something in notchbase doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the notch
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: notchbase version
      description: Shown in Settings, under Automatic updates.
      placeholder: "0.24.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System and version
      placeholder: "macOS 26.1 on a MacBook Pro, or Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, your config.json (remove anything private), or log lines starting with "notchbase:".
